name: Build MemorySweep

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建模组
        run: ./gradlew build --stacktrace

      - name: 上传构建产物(.jar)
        uses: actions/upload-artifact@v4
        with:
          name: memorysweep-neoforge-jar
          path: build/libs/*.jar
